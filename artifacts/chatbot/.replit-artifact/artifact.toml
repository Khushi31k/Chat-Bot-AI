kind = "web"
previewPath = "/"
title = "AI Chatbot"
version = "1.0.0"
id = "artifacts/chatbot"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22967

[services.development]
run = "bun run --filter @workspace/chatbot dev"

[services.production]
build = [ "bun", "run", "--filter", "@workspace/chatbot", "build" ]
serve = "static"
publicDir = "artifacts/chatbot/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22967"
BASE_PATH = "/"
